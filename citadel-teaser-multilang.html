<html lang="en">
<head>
<meta charset="UTF-8">
<title>CITadel — Product Teaser</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @page {
    size: A4 portrait;
    margin: 0;
  }

  body {
    font-family: 'Rubik', system-ui, sans-serif;
    color: #0f172a;
    background: #ffffff;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ===== Language switcher (non-printing) ===== */
  .lang-switcher {
    position: fixed;
    top: 12px;
    right: 16px;
    z-index: 1000;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    background: rgba(255,255,255,0.95);
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 8px 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  }

  .lang-btn {
    font-family: 'Rubik', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: #64748b;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 7px;
    padding: 5px 10px;
    cursor: pointer;
    transition: all 0.15s;
    text-decoration: none;
    display: inline-block;
  }

  .lang-btn:hover { background: #f0fdfa; border-color: #99f6e4; color: #0d9488; }
  .lang-btn.active { background: #0d9488; border-color: #0d9488; color: #fff; }

  @media print {
    .lang-switcher { display: none; }
  }

  /* ===== Pages ===== */
  .page {
    width: 210mm;
    min-height: 297mm;
    padding: 32mm 24mm 24mm 24mm;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    page-break-after: always;
  }

  /* Subtle dot grid */
  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(14,165,169,0.18) 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
  }

  /* Top accent stripe */
  .page::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, #0369a1, #0d9488, #0ea5e9);
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 10mm 24mm;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    z-index: 10;
  }

  .logo-group { display: flex; align-items: center; gap: 10px; }

  .logo-icon {
    width: 32px; height: 32px;
    background: #0d9488;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: white;
  }

  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-name { font-size: 14px; font-weight: 700; color: #0f172a; }
  .logo-tagline {
    font-size: 8px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 500;
  }

  .header-badge {
    font-size: 9px;
    color: #0d9488;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 20px;
    padding: 5px 14px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Content */
  .content { position: relative; z-index: 5; }

  .subtitle-line {
    font-size: 10px;
    color: #0d9488;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    color: #0f172a;
    line-height: 1.15;
    margin-bottom: 14px;
  }

  h1 span { color: #0d9488; }

  .description {
    font-size: 11.5px;
    color: #475569;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .badges { display: flex; gap: 6px; margin-bottom: 24px; flex-wrap: wrap; }

  .badge {
    font-size: 9px;
    font-weight: 600;
    color: #0d9488;
    border: 1px solid #99f6e4;
    border-radius: 20px;
    padding: 4px 11px;
    background: #f0fdfa;
  }

  .section-label {
    font-size: 9px;
    font-weight: 700;
    color: #0d9488;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::before, .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }

  /* Hero layout */
  .hero-layout {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 16px;
    align-items: center;
    margin-bottom: 0;
  }

  .hero-bone { display: flex; align-items: center; justify-content: center; }

  .hero-bone img {
    width: 100%;
    max-height: 210px;
    object-fit: contain;
  }

  /* Features grid */
  .features-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .feature-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
    border-left: 3px solid #0d9488;
  }

  .feature-icon {
    width: 28px; height: 28px;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    font-size: 13px;
  }

  .feature-title { font-size: 11px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
  .feature-desc { font-size: 9px; color: #64748b; line-height: 1.5; }

  /* Steps flow */
  .steps-flow {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
  }

  .step-box {
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    min-width: 115px;
  }

  .step-normal {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #64748b;
  }

  .step-highlight {
    background: #f0fdfa;
    border: 2px solid #0d9488;
    color: #0d9488;
    box-shadow: 0 2px 8px rgba(13,148,136,0.12);
  }

  .step-arrow { color: #94a3b8; font-size: 16px; margin: 0 6px; }

  /* Comparison */
  .comparison {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .comp-col { border-radius: 10px; padding: 14px; }

  .comp-current {
    background: #fef2f2;
    border: 1px solid #fecaca;
  }

  .comp-citadel {
    background: #f0fdfa;
    border: 1px solid #99f6e4;
  }

  .comp-title {
    font-size: 11px;
    font-weight: 700;
    color: #0f172a;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }

  .comp-icon-bad { color: #ef4444; font-size: 13px; }
  .comp-icon-good { color: #0d9488; font-size: 13px; }

  .comp-list { list-style: none; }

  .comp-list li {
    font-size: 9.5px;
    color: #475569;
    padding: 4px 0;
    display: flex; align-items: flex-start; gap: 6px; line-height: 1.4;
  }

  .comp-list li::before { content: attr(data-icon); font-size: 10px; flex-shrink: 0; margin-top: 1px; }

  /* Bottom accent bar */
  .accent-bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(to right, #0369a1, #0d9488, #0ea5e9);
  }

  /* ======= PAGE 2 ======= */
  .use-cases { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 24px; }

  .use-case {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-left: 3px solid #0d9488;
    border-radius: 10px;
    padding: 14px;
    display: flex; gap: 14px; align-items: flex-start;
  }

  .uc-icon {
    width: 34px; height: 34px;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; flex-shrink: 0;
  }

  .uc-title { font-size: 11px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
  .uc-desc { font-size: 9.5px; color: #64748b; line-height: 1.5; }

  .impact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .impact-item {
    text-align: center;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 9px;
    padding: 10px 6px;
  }

  .impact-icon { font-size: 15px; margin-bottom: 4px; }
  .impact-text { font-size: 8.5px; color: #475569; line-height: 1.4; }

  .validation-badges {
    display: flex; gap: 8px; justify-content: center;
    margin-bottom: 14px; flex-wrap: wrap;
  }

  .val-badge {
    font-size: 9px; font-weight: 600;
    color: #0d9488;
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 10px;
    padding: 7px 14px;
    text-align: center;
  }

  .partnership-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }

  .partner-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px;
  }

  .partner-icon { font-size: 18px; margin-bottom: 6px; }
  .partner-title { font-size: 11px; font-weight: 700; color: #0f172a; margin-bottom: 3px; }
  .partner-desc { font-size: 9px; color: #64748b; line-height: 1.5; }

  .about-card {
    display: flex;
    gap: 18px;
    align-items: center;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
  }

  .about-photo {
    width: 76px; height: 76px;
    border-radius: 10px;
    background: #e2e8f0;
    flex-shrink: 0;
    overflow: hidden;
    border: 2px solid #99f6e4;
  }

  .about-photo img { width: 100%; height: 100%; object-fit: cover; }

  .about-name { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }

  .about-role {

    color: #0d9488;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;

  .about-bio { font-size: 9.5px; color: #475569; line-height: 1.6; }

  .contact-bar {
    background: #f0fdfa;
    border: 1px solid #99f6e4;
    border-radius: 12px;
    padding: 18px 22px;
    text-align: center;
  }

  .contact-title { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
  .contact-text { font-size: 10px; color: #64748b; margin-bottom: 12px; }

  .contact-details {
    display: flex;
    justify-content: center;
    gap: 32px;
    font-size: 11px;
    color: #0f172a;
    font-weight: 600;
  }

  .contact-details span {
    color: #94a3b8;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    margin-bottom: 2px;
    font-weight: 500;
  }

  .confidential {
    position: absolute;
    bottom: 10mm;
    left: 24mm; right: 24mm;
    text-align: center;
    font-size: 7px;
    color: #94a3b8;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  @media print {
    body { background: white; }
    .page { box-shadow: none; }
  }
</style>
</head>

function render(lang) {
  const t = T[lang];
  document.documentElement.lang = lang;

  // Header
  set('hdr-tagline', t.tagline);
  set('hdr-tagline2', t.tagline);
  set('hdr-badge1', t.badge1);
  set('hdr-badge2', t.badge2);

  // Hero
  set('hero-posLine', t.positioningLine);
  set('hero-title', t.heroTitle + ' <span>' + t.heroHighlight + '</span>');
  set('hero-subtitle', t.subtitle);
  set('hero-badges', t.badges.map(b => `<span class="badge">${b}</span>`).join(''));

  // Labels
  set('lbl-pathway', t.lblPathway);
  set('lbl-features', t.lblFeatures);
  set('lbl-diff', t.lblDiff);
  set('lbl-usecases', t.lblUseCases);
  set('lbl-impact', t.lblImpact);
  set('lbl-validation', t.lblValidation);
  set('lbl-partnership', t.lblPartnership);

  // Steps
  const stepsHtml = t.steps.map((s, i) => {
    const isHl = i === 1;
    const cls = isHl ? 'step-box step-highlight' : 'step-box step-normal';
    const note = `<small style="font-weight:400;${isHl ? '' : 'color:#94a3b8'}">${t.stepsNote[i]}</small>`;
    const arrow = (i < t.steps.length - 1) ? `<div class="step-arrow">&rarr;</div>` : '';
    return `<div class="${cls}">${s}<br>${note}</div>${arrow}`;
  }).join('');
  set('steps-flow', stepsHtml);

  // Features
  set('features-grid', t.features.map(f =>
    `<div class="feature-card">
      <div class="feature-icon">${f.icon}</div>
      <div class="feature-title">${f.title}</div>
      <div class="feature-desc">${f.desc}</div>
    </div>`
  ).join(''));

  // Comparison
  set('comparison', `
    <div class="comp-col comp-current">
      <div class="comp-title"><span class="comp-icon-bad">&#10005;</span> ${t.currentTitle}</div>
      <ul class="comp-list">${t.currentItems.map(i => `<li data-icon="✕">${i}</li>`).join('')}</ul>
    </div>
    <div class="comp-col comp-citadel">
      <div class="comp-title"><span class="comp-icon-good">&#10003;</span> ${t.citadelTitle}</div>
      <ul class="comp-list">${t.citadelItems.map(i => `<li data-icon="✓">${i}</li>`).join('')}</ul>
    </div>
  `);

  // Use cases
  const ucIcons = ['⚠', '⚡', '✂'];
  set('use-cases', t.useCases.map((uc, i) =>
    `<div class="use-case">
      <div class="uc-icon">${ucIcons[i]}</div>
      <div>
        <div class="uc-title">${uc.title}</div>
        <div class="uc-desc">${uc.desc}</div>
      </div>
    </div>`
  ).join(''));

  // Impact
  const impIcons = ['⏱', '❤', '⚖', '✓'];
  set('impact-grid', t.impactItems.map((item, i) =>
    `<div class="impact-item">
      <div class="impact-icon">${impIcons[i]}</div>
      <div class="impact-text">${item}</div>
    </div>`
  ).join(''));

  // Validation
  set('val-badges', t.valBadges.map(b => `<span class="val-badge">${b}</span>`).join(''));
  set('val-desc', t.valDesc);
  set('val-trl', t.valTrl);

  // Partnership
  set('partnership-grid', t.partnerItems.map(p =>
    `<div class="partner-card">
      <div class="partner-icon">${p.icon}</div>
      <div class="partner-title">${p.title}</div>
      <div class="partner-desc">${p.desc}</div>
    </div>`
  ).join(''));

  // Doctor
  set('doc-name', t.docName);
  set('doc-role', t.docRole);
  set('doc-bio', t.docBio);

  // Contact
  set('contact-title', t.contactTitle);
  set('contact-desc', t.contactDesc);
  set('lbl-email', `<span>${t.emailLabel}</span>`);
  set('lbl-phone', `<span>${t.phoneLabel}</span>`);

  // Confidential
  set('confidential', t.confidential);

  // Lang switcher active state
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

// Build lang switcher
const switcher = document.getElementById('langSwitcher');
LANGS.forEach(l => {
  const btn = document.createElement('button');
  btn.className = 'lang-btn';
  btn.dataset.lang = l;
  btn.textContent = T[l].langName;
  btn.onclick = () => setLang(l);
  switcher.appendChild(btn);
});

// Initial render
render(getLang());
</script>
</body>
</html>
